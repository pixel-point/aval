name: rings_climbing
description: Advanced AVAL rings demo — climbing motion atlas (portal loops + pivots + one-shots).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  aval_flutter:
    path: ../../packages/aval_flutter
  aval_graph:
    path: ../../packages/aval_graph
  aval_format:
    path: ../../packages/aval_format

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/atlas/refs/
    - assets/atlas/portal/
    - assets/atlas/loops/
    - assets/atlas/pivots/
    - assets/atlas/oneshots/
