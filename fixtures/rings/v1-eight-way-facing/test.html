<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rings/Turn Edges Test — v1-eight-way-facing</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: monospace; background: #111; color: #eee; display: flex; height: 100vh; overflow: hidden; }

    #left { flex: 0 0 300px; display: flex; flex-direction: column; padding: 16px; gap: 12px; border-right: 1px solid #333; overflow-y: auto; }
    #right { flex: 1; display: flex; flex-direction: column; padding: 16px; gap: 12px; overflow: hidden; }

    h2 { font-size: 13px; color: #999; text-transform: uppercase; letter-spacing: 1px; }

    #stage { display: flex; align-items: center; justify-content: center; flex: 1; background: #1a1a1a; border-radius: 8px; }
    aval-player { width: 256px; height: 256px; image-rendering: pixelated; }

    .dir-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
    .dir-btn {
      padding: 10px 4px; border: 1px solid #444; background: #222; color: #ccc;
      border-radius: 4px; cursor: pointer; font-family: monospace; font-size: 12px;
      transition: background 0.1s;
    }
    .dir-btn:hover { background: #333; }
    .dir-btn.active { background: #2a4a2a; border-color: #5a5; color: #8f8; }

    #policy-select { padding: 6px; background: #222; border: 1px solid #444; color: #ccc; border-radius: 4px; font-family: monospace; width: 100%; }

    #plan-out { background: #0a1a0a; border: 1px solid #2a3a2a; border-radius: 4px; padding: 10px; font-size: 11px; min-height: 80px; white-space: pre; overflow: auto; color: #8f8; }
    #event-log { flex: 1; background: #1a1a0a; border: 1px solid #3a3a2a; border-radius: 4px; padding: 10px; font-size: 11px; overflow-y: auto; color: #dd8; }
    #event-log .entry { margin-bottom: 2px; }
    #event-log .turnstep { color: #f90; }
    #event-log .statechange { color: #9cf; }
    #event-log .transition { color: #c9f; }

    #state-badge { font-size: 16px; font-weight: bold; color: #8f8; text-align: center; padding: 4px; }
    #frame-badge { font-size: 11px; color: #666; text-align: center; }

    .clear-btn { padding: 4px 8px; background: #222; border: 1px solid #444; color: #888; border-radius: 3px; cursor: pointer; font-size: 11px; float: right; }
  </style>
</head>
<body>
<div id="left">
  <h2>State Control</h2>
  <div id="state-badge">walk_n</div>
  <div id="frame-badge">—</div>

  <div class="dir-grid">
    <div></div>
    <button class="dir-btn active" data-state="walk_n">N</button>
    <div></div>
    <button class="dir-btn" data-state="walk_nw">NW</button>
    <div></div>
    <button class="dir-btn" data-state="walk_ne">NE</button>
    <button class="dir-btn" data-state="walk_w">W</button>
    <div></div>
    <button class="dir-btn" data-state="walk_e">E</button>
    <button class="dir-btn" data-state="walk_sw">SW</button>
    <div></div>
    <button class="dir-btn" data-state="walk_se">SE</button>
    <div></div>
    <button class="dir-btn" data-state="walk_s">S</button>
    <div></div>
  </div>

  <h2>Turn Policy</h2>
  <select id="policy-select">
    <option value="forward">forward (prefer +1 steps)</option>
    <option value="backward">backward (prefer -1 steps)</option>
    <option value="shortest">shortest (auto-pick)</option>
  </select>

  <h2>planFor output</h2>
  <div id="plan-out">awaiting player...</div>

  <h2>Ring info</h2>
  <div id="plan-out" style="min-height:40px; color:#88f;">
    Ring: facing.walk · 8 states · cyclic<br>
    16 derived turn edges (±1 step each)<br>
    maxChainedSteps: 4
  </div>
</div>
<div id="right">
  <h2>AVAL Player — v1-eight-way-facing (placeholder frames)</h2>
  <div id="stage">
    <aval-player id="player">
      <source
        src="./public/vp9.avl"
        type='application/vnd.aval; codecs="vp09.00.21.08.01.01.01.01.00"'>
    </aval-player>
  </div>

  <h2 style="display:flex;justify-content:space-between;align-items:center;">
    Event log
    <button class="clear-btn" id="clear-log">clear</button>
  </h2>
  <div id="event-log"><div class="entry">Waiting for player...</div></div>
</div>

<script type="module">
  import { defineAvalElement } from "../../../packages/element/dist/auto.js";
  defineAvalElement();

  const player = document.getElementById("player");
  const planOut = document.getElementById("plan-out");
  const eventLog = document.getElementById("event-log");
  const stateBadge = document.getElementById("state-badge");
  const frameBadge = document.getElementById("frame-badge");
  const policySelect = document.getElementById("policy-select");
  let currentState = "walk_n";
  let logCount = 0;

  function addLog(text, cls) {
    const entry = document.createElement("div");
    entry.className = `entry ${cls || ""}`;
    entry.textContent = `[${String(++logCount).padStart(4, "0")}] ${text}`;
    eventLog.prepend(entry);
    if (eventLog.children.length > 200) eventLog.removeChild(eventLog.lastChild);
  }

  document.getElementById("clear-log").addEventListener("click", () => {
    eventLog.innerHTML = "";
    logCount = 0;
  });

  function updatePlan() {
    if (typeof player.planFor !== "function") {
      planOut.textContent = "planFor() not available";
      return;
    }
    try {
      const plan = player.planFor(currentState);
      planOut.textContent = JSON.stringify(plan, null, 2);
    } catch (e) {
      planOut.textContent = `Error: ${e.message}`;
    }
  }

  // Direction buttons
  document.querySelectorAll(".dir-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const target = btn.dataset.state;
      document.querySelectorAll(".dir-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentState = target;
      stateBadge.textContent = target;
      try {
        player.setState(target);
        addLog(`setState("${target}")`, "statechange");
      } catch (e) {
        addLog(`setState error: ${e.message}`);
      }
      updatePlan();
    });
  });

  // Turn policy
  policySelect.addEventListener("change", () => {
    const policy = policySelect.value;
    try {
      player.turnPolicy = policy;
      addLog(`turnPolicy = "${policy}"`);
    } catch (e) {
      // turnPolicy may not exist in all builds
      addLog(`turnPolicy N/A: ${e.message}`);
    }
  });

  // Player events
  player.addEventListener("statechange", e => {
    const state = e.detail?.state ?? e.state ?? "?";
    stateBadge.textContent = state;
    currentState = state;
    document.querySelectorAll(".dir-btn").forEach(b => {
      b.classList.toggle("active", b.dataset.state === state);
    });
    addLog(`statechange → "${state}"`, "statechange");
    updatePlan();
  });

  player.addEventListener("turnstep", e => {
    const d = e.detail ?? e;
    addLog(`turnstep: ${d.from ?? "?"} → ${d.to ?? "?"} (step ${d.step ?? "?"})`, "turnstep");
  });

  player.addEventListener("transition", e => {
    const d = e.detail ?? e;
    addLog(`transition: ${d.from ?? "?"} → ${d.to ?? "?"}`, "transition");
  });

  player.addEventListener("framechange", e => {
    const f = e.detail?.frame ?? e.frame;
    if (f !== undefined) frameBadge.textContent = `frame ${f}`;
  });

  player.addEventListener("ready", () => {
    addLog("player ready");
    updatePlan();
  });

  player.addEventListener("error", e => {
    addLog(`error: ${e.message ?? JSON.stringify(e.detail)}`, "");
  });

  // Initial plan
  updatePlan();
</script>
</body>
</html>
